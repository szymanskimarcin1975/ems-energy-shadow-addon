name: EMS HA epoch gateway isolated checks

on:
  push:
    paths:
      - 'deployment/adapter42/**'
      - 'custom_components/ems_epoch_gateway/**'
      - 'ems_shadow/tests/test_ha_gateway_store_20261018.py'
      - 'ems_shadow/tests/test_actuation_candidate.py'
      - 'ci/actuation/**'
      - 'tools/installation/**'
      - 'blueprints/automation/ems2/**'
      - '.github/workflows/ems-ha-epoch-gateway.yml'
  pull_request:
    paths:
      - 'deployment/adapter42/**'
      - 'custom_components/ems_epoch_gateway/**'
      - 'ems_shadow/tests/test_ha_gateway_store_20261018.py'
      - 'ems_shadow/tests/test_actuation_candidate.py'
      - 'ci/actuation/**'
      - 'tools/installation/**'
      - 'blueprints/automation/ems2/**'
      - '.github/workflows/ems-ha-epoch-gateway.yml'

permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax and integration metadata
        run: |
          python -m compileall -q custom_components/ems_epoch_gateway
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('custom_components/ems_epoch_gateway')
          data=json.loads((p/'manifest.json').read_text())
          assert data['domain']=='ems_epoch_gateway'
          assert data['config_flow'] is True
          assert data['requirements']==[]
          assert isinstance(data['codeowners'],list) and data['codeowners']
          assert (p/'services.yaml').exists()
          PY
      - name: Exact upstream companion source (never installed on HA)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: WillCodeForCats/solaredge-modbus-multi
          ref: d38d890887684ddd7938c4bce5223d387b24c6a7
          path: upstream
          persist-credentials: false
      - name: Installation, single attempt and termination observer tests
        env:
          SOLAREDGE_SOURCE: upstream/custom_components/solaredge_modbus_multi
        run: |
          python ci/actuation/test_installation_candidate.py -v
          python ci/actuation/test_poll120.py -v
          python ci/actuation/test_wear_energy.py -v
          python ci/actuation/test_adapter42_config.py -v
      - name: Windows installer syntax and SSH guard scenarios (mocked, no network)
        env:
          SOLAREDGE_SOURCE: upstream/custom_components/solaredge_modbus_multi
        run: pwsh -NoProfile -File ci/actuation/test_installer.ps1
      - name: Build disabled installation and exact upstream recovery artifacts
        run: |
          python tools/installation/prepare_candidate.py --solaredge-source upstream/custom_components/solaredge_modbus_multi --output installation-candidate
          cp deployment/adapter42/actuation_candidate.yaml installation-candidate/adapter42-actuation_candidate.yaml
          cp deployment/adapter42/README.md installation-candidate/adapter42-README.md
          cd installation-candidate
          sha256sum adapter42-* >> SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Preserve review artifacts (not a release or production installation)
        uses: actions/upload-artifact@v4
        with:
          name: ems2-disabled-installation-candidate
          path: installation-candidate/
          retention-days: 30
      - name: Candidate actuator, fences, stop, restart and simulated device
        run: python -m unittest discover -s ems_shadow/tests -p test_actuation_candidate.py -v
      - name: Persistent epoch and dedup tests (no HA, no device)
        run: python -m unittest discover -s ems_shadow/tests -p test_ha_gateway_store_20261018.py -v

  ha-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install exact HA API in isolated CI
        run: python -m pip install homeassistant==2026.10.0
      - name: Actual HA service registration, default no-write and permissions
        run: |
          python ci/actuation/ha_service_smoke.py
          python ci/actuation/ha_adapter42_smoke.py
      - name: Pinned transport no ambiguous write replay (loopback only)
        run: |
          python -m pip install 'modbus-connection[tmodbus]==4.10.0' tmodbus==0.6.1
          python ci/actuation/transport_single_attempt.py
