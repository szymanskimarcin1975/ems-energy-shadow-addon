name: EMS SHADOW amd64 build and smoke test
'on':
  push:
    branches: [main]
    paths: ['ems_shadow/**', '.github/workflows/ems-shadow-amd64.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ems-shadow-amd64-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python observer tests
        run: python3 -m unittest discover -s ems_shadow/tests -v
      - name: Build linux/amd64 locally, never push
        run: docker build --platform linux/amd64 -t ems-shadow:ci ems_shadow
      - name: Isolated synthetic container smoke test
        run: python3 ems_shadow/tests/container_smoke.py
