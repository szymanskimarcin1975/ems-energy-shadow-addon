name: Weather demand runtime amd64
on:
  push:
    branches: [candidate/weather-demand-20261016]
  pull_request:
    paths: ['ems_shadow/**', 'ci/weather_demand/**', '.github/workflows/weather-demand-runtime.yml']
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: ems_shadow/app:ems_shadow/app/observation:ems_shadow/app/staging:ems_shadow/app/diagnostic_export
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Privacy and unchanged legacy code
        run: python ci/privacy_check.py
      - name: Observer regression
        run: python -m unittest discover -s ems_shadow/tests -v
      - name: Weather and runtime regression
        run: python -m unittest discover -s ci/weather_demand -p 'test_*.py' -v
      - name: Build amd64 without registry publication
        run: docker build --platform linux/amd64 -t ems-demand:candidate ems_shadow
      - name: Actual worker with isolated synthetic HTTP, restart and SIGKILL
        run: docker run --rm --network none -e PYTHONPATH=/app:/app/observation -v "$PWD/ci/weather_demand:/tests:ro" --entrypoint python ems-demand:candidate /tests/container_smoke.py
      - name: Record image identity
        run: docker image inspect ems-demand:candidate --format '{{.Id}}'
