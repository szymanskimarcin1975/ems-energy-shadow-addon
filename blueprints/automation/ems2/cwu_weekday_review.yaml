# REVIEW ONLY: does not set temperatures, start heating, or write battery controls.
# Existing CWU v1.2 must retain actuator ownership. No weekend trigger/actions.
blueprint:
  name: EMS2 weekday CWU schedule checkpoint — review only
  description: >-
    Reviews the existing weekday requirement: start 02:30, target 50 C by 04:00,
    hold until 07:00. Reports observations only. Does not implement heating logic.
  domain: automation
  input:
    workday:
      selector:
        entity:
          domain: binary_sensor
    temperature:
      selector:
        entity:
          domain: sensor
    cwu_controller:
      selector:
        entity:
          domain: automation
trigger:
  - platform: time
    at: '02:30:00'
  - platform: time
    at: '04:00:00'
  - platform: time
    at: '07:00:00'
condition:
  - condition: state
    entity_id: !input workday
    state: 'on'
variables:
  temperature_entity: !input temperature
  controller_entity: !input cwu_controller
# Does not claim a fresh physical reading or ACK merely from the cached value.
action:
  - action: logbook.log
    data:
      name: EMS2 CWU review checkpoint
      message: >-
        Weekday checkpoint {{ now().strftime('%H:%M') }};
        cached temperature={{ states(temperature_entity) }};
        controller={{ states(controller_entity) }}. Target 50 C by 04:00,
        hold to 07:00; inspect actual sensor freshness before acceptance.
mode: single
