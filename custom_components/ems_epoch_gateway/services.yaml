status:
  name: Inspect durable fence
  description: Read-only status of the durable owner and request journal; never grants actuation.
  response:
    optional: false
dispatch:
  name: Submit fenced battery dispatch request
  description: Persist the request identity and reject without physical writes. All device dispatch remains disabled.
  response:
    optional: false
  fields:
    caller:
      required: true
      selector:
        text:
    operation:
      required: true
      selector:
        text:
    request_id:
      required: true
      selector:
        text:
    plan_id:
      required: true
      selector:
        text:
    owner_epoch:
      required: true
      selector:
        number:
          min: 0
          max: 2147483647
          mode: box
    option:
      required: true
      selector:
        text:
    power_w:
      required: true
      selector:
        number:
          min: 1
          max: 5000
          mode: box
    expires_at:
      required: true
      selector:
        number:
          min: 0
          mode: box

emergency_stop:
  name: Latch Emergency STOP
  description: >
    Persistently block all new EMS2 dispatch requests. This does not cancel a command
    already accepted by the inverter. There is intentionally no automatic clear or resume.
  response:
    optional: false
  fields:
    reason:
      required: true
      selector:
        text:
    request_id:
      required: false
      selector:
        text:
    owner_epoch:
      required: false
      selector:
        number:
          min: 0
          mode: box
    evidence:
      required: false
      selector:
        object:
